# Netlify auto-detects Next.js and uses the official Next.js runtime.
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

# Deploy previews and branch deploys show the preview banner and are not indexed.
[context.deploy-preview.environment]
  NEXT_PUBLIC_PREVIEW = "1"
[context.branch-deploy.environment]
  NEXT_PUBLIC_PREVIEW = "1"

# Legacy 301 redirects live in next.config.ts (redirects()). Do NOT add [[redirects]]
# here for localized paths: Netlify evaluates them after the next-intl rewrite, which
# caused infinite loops on /uk/pro-nas, /uk/kontakty and /fr/politique-de-confidentialite.

<!DOCTYPE html>
<html lang="pl">
<head><meta charset="utf-8"><meta name="robots" content="noindex"><title>Formularze</title></head>
<body>
<!-- Netlify Forms registration skeleton for the React appointment form (src/components/ContactForm.tsx).
     Field names must match the component exactly. -->
<form name="wizyta" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input type="hidden" name="form-name" value="wizyta" />
  <input type="hidden" name="subject" />
  <input type="text" name="name" />
  <input type="tel" name="phone" />
  <input type="email" name="email" />
  <input type="date" name="date" />
  <select name="service"><option value="general">general</option></select>
  <select name="location"><option value="">-</option></select>
  <textarea name="message"></textarea>
  <input type="text" name="consent" />
  <input type="text" name="language" />
  <input name="bot-field" />
</form>
</body>
</html>
